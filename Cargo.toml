[package]
name = "tauri-app-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
yew = { version = "0.21", features = ["csr"] }
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = [
    "Element", "DomRect", "MouseEvent", "KeyboardEvent", "HtmlInputElement", "DragEvent",
    "HtmlTextAreaElement", "InputEvent", "FocusEvent", "HtmlSelectElement",
    "File", "FileList", "DataTransfer", "Blob", "BlobPropertyBag", "Url", "HtmlImageElement", "Event",
    "WheelEvent", "Window", "Document", "HtmlCanvasElement", "CanvasRenderingContext2d",
] }

[workspace]
members = ["src-tauri"]
